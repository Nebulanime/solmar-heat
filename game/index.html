<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLMAR HEAT — an open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; background: #14101f; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #wrap { position: relative; width: 1280px; height: 720px; }
  canvas { display: block; width: 1280px; height: 720px; background: #7fae62; border: 0; }
  #note { position: absolute; left: 0; right: 0; bottom: -28px; color: #888; font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="note">SOLMAR HEAT — original open-world crime game. WASD move/drive, E steal car, Space punch, F shoot, P pause. Progress auto-saves in your browser.</div>
</div>
<script type="module" src="./src/main.mjs"></script>
</body>
</html>
