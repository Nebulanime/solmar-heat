<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Heat — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c101a; font-family: 'Segoe UI', system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #f4ead8; text-shadow: 0 2px 4px rgba(0,0,0,0.7); }
  #hud-top { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; }
  #hud-cash { font-size: 30px; font-weight: 800; color: #7fe08a; }
  #hud-clock { font-size: 22px; font-weight: 700; margin-top: 2px; }
  #hud-stars { font-size: 30px; letter-spacing: 4px; }
  #hud-health { width: 220px; height: 14px; background: rgba(0,0,0,0.55); border: 2px solid rgba(244,234,216,0.8); border-radius: 7px; margin-top: 6px; overflow: hidden; }
  #hud-health-fill { height: 100%; width: 100%; background: #4fae62; }
  #hud-objective { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); max-width: 46%; text-align: center; font-size: 19px; font-weight: 700; background: rgba(12,16,26,0.62); padding: 8px 16px; border-radius: 10px; border: 1px solid rgba(242,193,78,0.6); }
  #hud-message { position: absolute; top: 84px; left: 50%; transform: translateX(-50%); max-width: 60%; text-align: center; font-size: 18px; font-style: italic; background: rgba(12,16,26,0.55); padding: 6px 14px; border-radius: 8px; transition: opacity 0.4s; }
  #minimap { position: absolute; right: 16px; bottom: 16px; width: 210px; height: 210px; border: 3px solid rgba(244,234,216,0.85); border-radius: 50%; background: rgba(16,22,32,0.85); }
  #hud-bottom { position: absolute; left: 16px; bottom: 16px; font-size: 17px; font-weight: 600; }
  #hud-speed { font-size: 26px; font-weight: 800; color: #ffd94d; }
  #hud-ammo { margin-top: 4px; opacity: 0.9; }
  #hud-title { position: absolute; left: 16px; bottom: 16px; font-size: 13px; opacity: 0.65; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Heat: an open-world crime game in the city of Solmar"></canvas>
<div id="hud" style="display:none">
  <div id="hud-top">
    <div>
      <div id="hud-cash">$120</div>
      <div id="hud-clock">09:24</div>
      <div id="hud-health"><div id="hud-health-fill"></div></div>
    </div>
    <div id="hud-objective">Press M to start the story</div>
    <div id="hud-stars">☆☆☆☆☆</div>
  </div>
  <div id="hud-message"></div>
  <div id="hud-bottom">
    <div id="hud-speed"></div>
    <div id="hud-ammo">Q punch • E steal car • M story</div>
  </div>
  <canvas id="minimap" width="210" height="210"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
