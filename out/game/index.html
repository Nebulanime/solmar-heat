<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SOLMAR HEAT — an original open-world crime game in the fictional coastal city of Solmar. Steal cars, outrun the Solmar PD, and run four story missions for Rico and Mara.">
<title>SOLMAR HEAT — Open-World Crime in Solmar</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1220; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  noscript p { color: #f2f4f6; font: 16px system-ui, sans-serif; text-align: center; margin-top: 40vh; }
</style>
</head>
<body>
<canvas id="game" aria-label="SOLMAR HEAT: steal cars, outrun the Solmar PD, and run four story missions for Rico and Mara"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p>SOLMAR HEAT needs JavaScript to run.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
